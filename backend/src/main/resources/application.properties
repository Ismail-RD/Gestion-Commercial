# Secrets et reglages propres au poste : identifiants SMTP, cles, surcharges
# locales. Ce fichier n'est pas versionne (voir .gitignore) et son absence
# n'empeche pas l'application de demarrer, d'ou le prefixe "optional:".
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestioncommerciale}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway gere le schema ; Hibernate se contente de le valider au demarrage
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# /error est accessible sans authentification (voir SecurityConfig) : on ne
# doit donc jamais y exposer de stacktrace ni de detail interne.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# --- Amorcage ---
# Donnees de demonstration (comptes connus, clients et produits d'exemple).
# Faux par defaut : une mise en production n'a donc rien a desactiver.
app.donnees-demo=${DONNEES_DEMO:false}

# Premier administrateur, cree uniquement si la base ne contient aucun
# utilisateur. A definir le temps du premier demarrage, puis a retirer.
app.bootstrap.admin-email=${APP_ADMIN_EMAIL:}
app.bootstrap.admin-mot-de-passe=${APP_ADMIN_MOT_DE_PASSE:}

# Signature des jetons. Aucune valeur par defaut : un secret ecrit ici serait
# public, et quiconque le lirait pourrait forger un jeton d'administrateur.
# A definir par la variable JWT_SECRET ou dans application-local.properties ;
# l'application refuse de demarrer sans (voir JwtService).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Stockage des fiches techniques sur disque (seul le chemin est conserve en base)
app.upload.dir=${UPLOAD_DIR:./uploads/fiches-techniques}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Les seuils de remise ne sont plus ici : ils vivent en base, un par role, et
# se reglent depuis l'ecran Parametres (table seuils_remise).

# Informations societe imprimees sur les documents PDF (devis...).
# En-tete : valeurs reelles ; mentions legales : PLACEHOLDERS a remplacer.
app.societe.nom=SOGETHERM
app.societe.tagline=Thermique & Batiment
app.societe.adresse=7, Rue Raphael Mariscal, Casablanca  Maroc
app.societe.tel=0522 80 03 13
app.societe.fax=0522 85 54 47
app.societe.email=contact@sogetherm.com
app.societe.site-web=www.sogetherm.com
app.societe.rc=RC A REMPLIR
app.societe.patente=PATENTE A REMPLIR
app.societe.identifiant-fiscal=IDENT. FISCAL A REMPLIR
app.societe.cnss=CNSS A REMPLIR
app.societe.ice=ICE A REMPLIR

# --- Envoi des devis par email ---
# PLACEHOLDERS : renseigner le serveur SMTP reel (ou via variables d'env).
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Adresse affichee comme expediteur
app.mail.expediteur=${MAIL_FROM:ismailrd04@gmail.com}
# Base de l'URL du front : sert a construire le lien personnel du client
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Origines autorisees a appeler l'API (CORS). A completer au deploiement avec
# l'adresse reelle du frontend, sans quoi l'application refusera son propre site.
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Textes imprimes sur les documents PDF.
# ATTENTION : ce fichier est lu en ISO-8859-1. Tout accent doit etre echappe en
# \uXXXX, sinon il ressort illisible sur le PDF.
# Rappel : a accent grave = \u00e0, e accent aigu = \u00e9, e accent grave = \u00e8.

# Conditions par defaut affichees sur le devis
app.devis.conditions.livraison=Mat\u00e9riel livr\u00e9 dans nos magasins
app.devis.conditions.reglement=Mode de r\u00e8glement par ch\u00e8que : 50% \u00e0 la commande, 50% \u00e0 la livraison.
app.devis.conditions.validite=Offre valable : 7 jours

# Notes imprimees au bas du bon de livraison
app.bon-livraison.notes[0]=Le mat\u00e9riel livr\u00e9 ne sera pas repris ni \u00e9chang\u00e9
app.bon-livraison.notes[1]=Quel que soit le mode de transport, les marchandises voyagent aux risques et p\u00e9rils du destinataire
# --- Alertes d'echeance ---
# Balayage nocturne : combien de jours a l'avance on previent.
# Un effet se remet en banque quelques jours avant son echeance ; un devis se
# relance pendant qu'il est encore valable.
app.alertes.effet-jours-avant=${ALERTES_EFFET_JOURS:3}
app.alertes.devis-jours-avant=${ALERTES_DEVIS_JOURS:7}
