# Configuration de test : base H2 en memoire (aucun PostgreSQL requis)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Secret JWT de test (Base64, >= 256 bits)
app.jwt.secret=dGVzdC1zZWNyZXQtand0LWtleS1mb3ItdW5pdC10ZXN0cy1taW5pbXVtLTI1Ni1iaXRz
app.jwt.expiration-ms=3600000

# Les tests utilisent H2 avec un schema genere par Hibernate : Flyway desactive
spring.flyway.enabled=false

# Hote fictif : suffit a creer le bean JavaMailSender. Aucun test n'envoie
# reellement d'email (une tentative echouerait en 503, comportement attendu).
spring.mail.host=localhost
spring.mail.port=3025
app.mail.expediteur=test@sogetherm.local
app.frontend.url=http://localhost:5173

# Uploads de test isoles du dossier de developpement
app.upload.dir=./target/uploads-test
app.cors.origins=http://localhost:5173

# Les tests se connectent avec les comptes de demonstration : ils sont
# donc actives ici, et nulle part ailleurs par defaut.
app.donnees-demo=true
